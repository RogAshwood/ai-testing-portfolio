" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="655.2" y="56" width="144.8" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="727.6" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">5. Reporting</text><text x="727.6" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Defects and</text><text x="727.6" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">coverage</text><path d="M178.8 150V158H323.6V150" fill="none" stroke="#534AB7" stroke-width="1.2"/><text x="251.20000000000002" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">System under test</text><text x="410.0" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">The benchmark measures the AI's draft before a tester reviews it.</text><rect x="201.0" y="222" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8" /><text x="221.0" y="229" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Tested in this exercise</text><rect x="406.79999999999995" y="222" width="14" height="14" rx="3" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="426.79999999999995" y="229" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Out of scope (context only)</text