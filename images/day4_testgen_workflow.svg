<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img"><title>Where AI test generation sits in the delivery process</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="250" rx="12" fill="#FCFCFB"/><text x="20" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Where AI test generation sits in the delivery process</text><rect x="20.0" y="56" width="144.8" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="92.4" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">1. User story</text><text x="92.4" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Story and</text><text x="92.4" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">acceptance criteria</text><path d="M165.8 99.0H176.8" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="178.8" y="56" width="144.8" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" /><text x="251.20000000000002" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">2. AI generates</text><text x="251.20000000000002" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="midd