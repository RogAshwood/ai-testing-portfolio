<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1280" viewBox="0 0 1200 1280" role="img"><title>Three AI systems under test</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="1200" height="1280" fill="#FCFCFB"/><text x="40" y="48" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">One fictional insurer, three AI systems under test</text><text x="40" y="86" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Where the AI sits in each process, and how it was tested</text><rect x="30" y="120" width="1140" height="326" rx="16" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1"/><text x="60" y="154" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">1. CLAIMS TRIAGE</text><text x="60" y="182" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">An LLM recommends how to route each insurance claim; a person decides</text><rect x="60" y="218" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" /><text x="170.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Claim</text><text x="170.0" y="278.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">amount, dates, receipt</text><rect x="314" y="218" width="250" height="96" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2" /><text x="439.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#3C3489" text-anchor="middle" dominant-baseline="central">AI Triage</text><text x="439.0" y="278.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">route, reason, summary</text><rect x="515.5" y="205" width="40.5" height="26" rx="13" fill="#534AB7"/><text x="535.75" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">LLM</text><rect x="598" y="218" width="230" height="96" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" /><text x="713.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Recommendation</text><text x="713.0" y="278.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">auto-approve or review</text><rect x="862" y="218" width="250" height="96" rx="12" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/><text x="987.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Claims Assessor</text><text x="987.0" y="278.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#888780" text-anchor="middle" dominant-baseline="central">makes the decision</text><path d="M282 266.0L311 266.0" fill="none" stroke="#5F5E5A" stroke-width="2" marker-end="url(#a)"/><path d="M566 266.0L595 266.0" fill="none" stroke="#5F5E5A" stroke-width="2" marker-end="url(#a)"/><path d="M830 266.0L859 266.0" fill="none" stroke="#5F5E5A" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="342" width="1080" height="82" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="80" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#085041" text-anchor="start" dominant-baseline="central">Tested by:</text><text x="182" y="370" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">35 claims with known correct answers, checked automatically · an AI judge, checked against my own labels</text><text x="80" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#085041" text-anchor="start" dominant-baseline="central">Tools:</text><text x="182" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">Promptfoo (checks written as assertions) · Python for the reference answers and the analysis</text><rect x="30" y="468" width="1140" height="326" rx="16" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1"/><text x="60" y="502" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">2. MEMBER-HELP CHATBOT</text><text x="60" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Retrieval-augmented generation (RAG): find the policy text, then answer from it</text><rect x="60" y="566" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" /><text x="170.0" y="602.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Member Question</text><text x="170.0" y="626.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">about their cover</text><rect x="314" y="566" width="250" height="96" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2" /><text x="439.0" y="602.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#0C447C" text-anchor="middle" dominant-baseline="central">Retriever (R)</text><text x="439.0" y="626.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#185FA5" text-anchor="middle" dominant-baseline="central">finds policy text</text><rect x="487.0" y="553" width="69.0" height="26" rx="13" fill="#185FA5"/><text x="521.5" y="566" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">SEARCH</text><rect x="598" y="566" width="250" height="96" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2" /><text x="723.0" y="602.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Generator</text><text x="723.0" y="626.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">writes the answer</text><rect x="799.5" y="553" width="40.5" height="26" rx="13" fill="#534AB7"/><text x="819.75" y="566" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">LLM</text><rect x="882" y="566" width="230" height="96" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" /><text x="997.0" y="602.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Answer</text><text x="997.0" y="626.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">to the member</text><path d="M282 614.0L311 614.0" fill="none" stroke="#5F5E5A" stroke-width="2" marker-end="url(#a)"/><path d="M566 614.0L595 614.0" fill="none" stroke="#5F5E5A" stroke-width="2" marker-end="url(#a)"/><path d="M850 614.0L879 614.0" fill="none" stroke="#5F5E5A" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="690" width="1080" height="82" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="80" y="718" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#085041" text-anchor="start" dominant-baseline="central">Tested by:</text><text x="182" y="718" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">each RAG component tested on its own and then end to end · an AI judge, checked against my own labels</text><text x="80" y="744" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#085041" text-anchor="start" dominant-baseline="central">Tools:</text><text x="182" y="744" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">DeepEval with pytest · scikit-learn for the search step (TF-IDF) · Python for the analysis</text><rect x="30" y="816" width="1140" height="326" rx="16" fill="#FFFFFF" stroke="#E4E2DA" stroke-width="1"/><text x="60" y="850" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">3. AI TEST-CASE GENERATOR</text><text x="60" y="878" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">An LLM turns a user story into test cases for a tester to review</text><rect x="60" y="914" width="220" height="96" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" /><text x="170.0" y="950.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">User Story</text><text x="170.0" y="974.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">and acceptance criteria</text><rect x="314" y="914" width="250" height="96" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="2" /><text x="439.0" y="950.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#3C3489" text-anchor="middle" dominant-baseline="central">AI Test Generator</text><text x="439.0" y="974.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">prompt v1 or v2</text><rect x="515.5" y="901" width="40.5" height="26" rx="13" fill="#534AB7"/><text x="535.75" y="914" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">LLM</text><rect x="598" y="914" width="230" height="96" rx="12" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" /><text x="713.0" y="950.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Test Cases</text><text x="713.0" y="974.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">one set per story</text><rect x="862" y="914" width="250" height="96" rx="12" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/><text x="987.0" y="950.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" font-weight="650" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Tester</text><text x="987.0" y="974.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#888780" text-anchor="middle" dominant-baseline="central">reviews and edits</text><path d="M282 962.0L311 962.0" fill="none" stroke="#5F5E5A" stroke-width="2" marker-end="url(#a)"/><path d="M566 962.0L595 962.0" fill="none" stroke="#5F5E5A" stroke-width="2" marker-end="url(#a)"/><path d="M830 962.0L859 962.0" fill="none" stroke="#5F5E5A" stroke-width="2" marker-end="url(#a)"/><rect x="60" y="1038" width="1080" height="82" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/><text x="80" y="1066" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#085041" text-anchor="start" dominant-baseline="central">Tested by:</text><text x="182" y="1066" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">against 78 expert test ideas · an AI judge, itself tested with deliberately flawed test cases</text><text x="80" y="1092" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="700" fill="#085041" text-anchor="start" dominant-baseline="central">Tools:</text><text x="182" y="1092" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15.5" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">OpenAI API · bespoke Python scoring code, re-run monthly in GitHub Actions</text><rect x="60" y="1170" width="20" height="20" rx="5" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.2" /><text x="88" y="1180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Large language model (LLM)</text><rect x="328.6" y="1170" width="20" height="20" rx="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.2" /><text x="356.6" y="1180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Search, not an LLM</text><rect x="532.4" y="1170" width="20" height="20" rx="5" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="1.2" /><text x="560.4" y="1180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Inputs and outputs</text><rect x="736.1999999999999" y="1170" width="20" height="20" rx="5" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="1.2" stroke-dasharray="5 4"/><text x="764.1999999999999" y="1180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Person</text><rect x="842.8" y="1170" width="20" height="20" rx="5" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1.2" /><text x="870.8" y="1180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">How it was tested</text><text x="40" y="1234" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#888780" text-anchor="start" dominant-baseline="central">All data synthetic · re-run automatically with quality gates · github.com/RogAshwood/ai-testing-portfolio</text></svg>