<svg xmlns="http://www.w3.org/2000/svg" width="820" height="250" viewBox="0 0 820 250" role="img"><title>Where the member-help chatbot sits in the member journey</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="820" height="250" rx="12" fill="#FCFCFB"/><text x="20" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Where the member-help chatbot sits in the member journey</text><rect x="20.0" y="56" width="144.8" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="92.4" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">1. Question</text><text x="92.4" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Member asks about</text><text x="92.4" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">their cover</text><path d="M165.8 99.0H176.8" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="178.8" y="56" width="144.8" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" /><text x="251.20000000000002" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">2. Retrieve</text><text x="251.20000000000002" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Find relevant</text><text x="251.20000000000002" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">policy text</text><path d="M324.6 99.0H335.6" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="337.6" y="56" width="144.8" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" /><text x="410.0" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">3. Answer</text><text x="410.0" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">LLM writes reply</text><text x="410.0" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">from that text</text><path d="M483.40000000000003 99.0H494.40000000000003" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="496.40000000000003" y="56" width="144.8" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="568.8000000000001" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">4. Member acts</text><text x="568.8000000000001" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Claims, calls</text><text x="568.8000000000001" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">or asks again</text><path d="M642.2 99.0H653.2" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="655.2" y="56" width="144.8" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="727.6" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">5. Contact centre</text><text x="727.6" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Handles what</text><text x="727.6" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">the bot declines</text><path d="M178.8 150V158H482.40000000000003V150" fill="none" stroke="#534AB7" stroke-width="1.2"/><text x="330.6" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">System under test: retriever and generator</text><text x="410.0" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Tested as two components and end to end, so a failure can be traced to the part that caused it.</text><rect x="201.0" y="222" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8" /><text x="221.0" y="229" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Tested in this exercise</text><rect x="406.79999999999995" y="222" width="14" height="14" rx="3" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="426.79999999999995" y="229" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Out of scope (context only)</text></svg>