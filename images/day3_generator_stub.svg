<svg xmlns="http://www.w3.org/2000/svg" width="680" height="696" viewBox="0 0 680 696" role="img"><title>Generator alone: the retriever replaced by a stub</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="696" rx="12" fill="#FCFCFB"/><rect x="40" y="30" width="290" height="64" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="54" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Policy documents (10 .md files)</text><text x="54" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">cut into 49 chunks by rag_pipeline.py</text><rect x="350" y="30" width="290" height="64" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="364" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Golden set: rag_golden.csv</text><text x="364" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">expected_sources and key_facts</text><path d="M150 94V118" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M250 94V106H440" fill="none" stroke="#888780" stroke-width="1"/><path d="M440 106V118" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M560 94V118" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="120" width="290" height="508" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/><text x="185" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">End to end (section 4)</text><rect x="350" y="120" width="290" height="508" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/><text x="495" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Generator alone (section 3)</text><rect x="60" y="164" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="74" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Member question</text><text x="74" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Q02 "Is acupuncture covered?"</text><path d="M185 220V240" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="370" y="164" width="250" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="384" y="184" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Member question</text><text x="384" y="206" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Q02 "Is acupuncture covered?"</text><path d="M495 220V240" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="60" y="242" width="250" height="96" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="74" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">Retriever: TfidfRetriever</text><text x="74" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">rag_pipeline.py: scores all 49</text><text x="74" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">chunks by shared words and</text><text x="74" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="start" dominant-baseline="central">passes on the top k=3</text><rect x="370" y="242" width="250" height="96" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8"/><text x="384" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#633806" text-anchor="start" dominant-baseline="central">Stub: golden_context()</text><text x="384" y="284" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start" dominant-baseline="central">rag_metrics.py: keeps a chunk only</text><text x="384" y="302" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start" dominant-baseline="central">if it is from an expected_source</text><text x="384" y="320" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#854F0B" text-anchor="start" dominant-baseline="central">AND contains a key_fact</text><path d="M185 338V356" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M495 338V356" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="60" y="358" width="250" height="114" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="74" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Chunks passed on for Q02</text><text x="74" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">01_plan_overview#5</text><text x="74" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">03_exclusions#3</text><text x="74" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">01_plan_overview#2</text><text x="74" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">none holds the answer</text><rect x="370" y="358" width="250" height="114" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="384" y="378" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Chunks passed on for Q02</text><text x="384" y="400" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">03_exclusions#2</text><text x="384" y="418" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">the exclusions list,</text><text x="384" y="436" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">which holds the answer</text><path d="M185 472V490" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="60" y="492" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="185.0" y="510.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Generator: generate()</text><text x="185.0" y="530.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">gpt-6-luna, same system prompt</text><path d="M185 548V566" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="60" y="568" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="185.0" y="590.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Answer, saved to results/</text><path d="M495 472V490" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="370" y="492" width="250" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="495.0" y="510.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Generator: generate()</text><text x="495.0" y="530.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">gpt-6-luna, same system prompt</text><path d="M495 548V566" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="370" y="568" width="250" height="44" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="495.0" y="590.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Answer, saved to results/</text><text x="340" y="652" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Same generator and prompt: only the source of the chunks changes.</text><text x="340" y="672" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Only the stub reads the golden set; the real retriever never sees it.</text></svg>