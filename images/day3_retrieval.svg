<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img"><title>How the retriever ranks chunks and applies k</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="450" rx="12" fill="#FCFCFB"/><rect x="130" y="30" width="220" height="44" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="240.0" y="52.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">"Is acupuncture covered?"</text><path d="M240 74V108" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="110" y="110" width="260" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="240.0" y="128.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">TF-IDF scores all 49 chunks</text><text x="240.0" y="148.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Shared words, scored 0 to 1</text><path d="M240 166V200" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="202" width="400" height="36" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="56" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">#1</text><text x="86" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">0.145</text><text x="140" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">01_plan_overview#5</text><text x="296" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Signpost paragraph</text><rect x="40" y="246" width="400" height="36" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="56" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">#2</text><text x="86" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">0.134</text><text x="140" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">03_exclusions#3</text><text x="296" y="264" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Mixed-receipt rule</text><rect x="40" y="290" width="400" height="36" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="56" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">#3</text><text x="86" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">0.125</text><text x="140" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">01_plan_overview#2</text><text x="296" y="308" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Who is covered</text><rect x="40" y="366" width="400" height="36" rx="6" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="56" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">#4</text><text x="86" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">0.122</text><text x="140" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#085041" text-anchor="start" dominant-baseline="central">03_exclusions#2</text><text x="296" y="384" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Answer is here</text><line x1="40" y1="346" x2="180" y2="346" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="5 4"/><text x="240" y="346" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">k = 3 cut-off</text><line x1="300" y1="346" x2="440" y2="346" stroke="#BA7517" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M440 264H468" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="470" y="236" width="170" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="555.0" y="254.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Generator</text><text x="555.0" y="274.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Sees top 3 only</text><text x="340" y="426" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Rank, score, chunk. The chunk with the answer ranks 4th, so with k=3 the generator never sees it.</text></svg>