<svg xmlns="http://www.w3.org/2000/svg" width="680" height="728" viewBox="0 0 680 728" role="img"><title>How the judge is calibrated against human labels</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="728" rx="12" fill="#FCFCFB"/><rect x="200" y="30" width="280" height="74" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="214" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Saved answers (no new calls)</text><text x="214" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">section 3: generator alone</text><text x="214" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">section 4: end to end, repeat 1</text><path d="M340 104V128" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="170" y="130" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="340.0" y="148.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Step 6.1: pick 10 answers</text><text x="340.0" y="168.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">a spread of high, low and borderline scores</text><path d="M300 186V202H180" fill="none" stroke="#888780" stroke-width="1"/><path d="M180 202V218" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M380 186V202H500" fill="none" stroke="#888780" stroke-width="1"/><path d="M500 202V218" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><text x="180" y="210" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central"></text><rect x="40" y="220" width="280" height="96" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="54" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Blind labelling sheet</text><text x="54" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">judge_calibration_sheet.csv</text><text x="54" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">no scores, no question IDs</text><text x="54" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">shuffled, IDs L01 to L10</text><path d="M180 316V342" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="344" width="280" height="96" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="54" y="364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">You label each answer (Excel)</text><text x="54" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">human_label: pass or fail</text><text x="54" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">human_note: why</text><text x="54" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">rule: could the member act on it?</text><rect x="360" y="220" width="280" height="96" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="374" y="240" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Key file (kept separate)</text><text x="374" y="262" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">judge_calibration_key.csv</text><text x="374" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">links L01 to L10 back to the</text><text x="374" y="298" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">question and section</text><path d="M500 316V342" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="360" y="344" width="280" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="374" y="364" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">The judge's saved verdict</text><text x="374" y="386" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">Correctness score (gpt-6-sol)</text><text x="374" y="404" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">from sections 3 and 4</text><text x="374" y="422" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">pass if score >= pass mark</text><path d="M180 440V468" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M500 440V468" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="120" y="470" width="440" height="96" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="134" y="490" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Step 6.2: compare, item by item</text><text x="134" y="512" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">agree: same verdict</text><text x="134" y="530" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">FALSE PASS: judge pass, human fail (the costly error)</text><text x="134" y="548" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">false fail: judge fail, human pass</text><path d="M340 566V594" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="150" y="596" width="380" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="340.0" y="614.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Step 6.3: try pass marks from 0.5 to 1.0</text><text x="340.0" y="634.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">pick: no false passes, most agreement</text><text x="340" y="684" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Result: 6 of 10 agree at 0.75. The judge checks that facts are present;</text><text x="340" y="704" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">the human judged the answer as a member would. No pass mark closes that gap.</text></svg>