<svg xmlns="http://www.w3.org/2000/svg" width="920" height="250" viewBox="0 0 920 250" role="img"><title>Where the claim-triage step sits in the claims process</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="920" height="250" rx="12" fill="#FCFCFB"/><text x="20" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Where the claim-triage step sits in the claims process</text><rect x="20.0" y="56" width="113.71428571428571" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="76.85714285714286" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">1. Submission</text><text x="76.85714285714286" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Member sends</text><text x="76.85714285714286" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">claim, receipt</text><path d="M134.71428571428572 99.0H145.71428571428572" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="147.71428571428572" y="56" width="113.71428571428571" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="204.57142857142858" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">2. Intake</text><text x="204.57142857142858" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Record checked</text><text x="204.57142857142858" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">(assumed done)</text><path d="M262.42857142857144 99.0H273.42857142857144" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="275.42857142857144" y="56" width="113.71428571428571" height="86" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" /><text x="332.2857142857143" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">3. AI triage</text><text x="332.2857142857143" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">LLM recommends</text><text x="332.2857142857143" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">route, reason</text><path d="M390.14285714285717 99.0H401.14285714285717" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="403.1428571428571" y="56" width="113.71428571428571" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="459.99999999999994" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">4. Queueing</text><text x="459.99999999999994" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Auto-approvals</text><text x="459.99999999999994" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">spot-checked</text><path d="M517.8571428571428 99.0H528.8571428571428" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="530.8571428571429" y="56" width="113.71428571428571" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="587.7142857142858" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">5. Decision</text><text x="587.7142857142858" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Assessor makes</text><text x="587.7142857142858" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">the decision</text><path d="M645.5714285714286 99.0H656.5714285714286" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="658.5714285714286" y="56" width="113.71428571428571" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="715.4285714285714" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">6. Payment</text><text x="715.4285714285714" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Member paid</text><text x="715.4285714285714" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">and told</text><path d="M773.2857142857142 99.0H784.2857142857142" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="786.2857142857142" y="56" width="113.71428571428571" height="86" rx="8" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="843.1428571428571" y="81.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#888780" text-anchor="middle" dominant-baseline="central">7. Appeal</text><text x="843.1428571428571" y="99.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">Senior assessor</text><text x="843.1428571428571" y="117.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#9C9A92" text-anchor="middle" dominant-baseline="central">reviews</text><path d="M275.42857142857144 150V158H389.14285714285717V150" fill="none" stroke="#534AB7" stroke-width="1.2"/><text x="332.28571428571433" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">System under test</text><text x="460.0" y="204" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">The LLM only recommends. A human assessor decides, so a wrong auto-approval is the costly error.</text><rect x="251.0" y="222" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8" /><text x="271.0" y="229" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Tested in this exercise</text><rect x="456.79999999999995" y="222" width="14" height="14" rx="3" fill="#F4F3EF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="4 3"/><text x="476.79999999999995" y="229" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Out of scope (context only)</text></svg>