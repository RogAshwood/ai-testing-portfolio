<svg xmlns="http://www.w3.org/2000/svg" width="940" height="760" viewBox="0 0 940 760" role="img"><title>The M5 chatbot test set-up in QA terms</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="940" height="760" rx="12" fill="#FCFCFB"/><text x="24" y="28" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">How the M5 chatbot was tested, in QA terms</text><text x="24" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Two check layers on every turn; the judge itself was tested before it was trusted.</text><text x="99.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">TEST BASIS</text><text x="281.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">ORACLE</text><text x="473.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">EXECUTION</text><text x="675.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">CHECKS</text><text x="854.0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">RESULT</text><rect x="24" y="110" width="150" height="120" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="99.0" y="134.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Test basis</text><text x="99.0" y="152.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">chatbot_spec.md</text><text x="99.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">rules R1-R25</text><text x="99.0" y="188.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">claims data</text><text x="99.0" y="206.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">policy documents</text><rect x="196" y="110" width="170" height="120" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="281.0" y="134.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Oracle (golden set)</text><text x="281.0" y="152.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">28 conversations; for each</text><text x="281.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">turn: tools to call or avoid,</text><text x="281.0" y="188.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">facts the reply must hold,</text><text x="281.0" y="206.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">which judge checks apply</text><rect x="196" y="268" width="170" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="281.0" y="288.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">QA of the oracle</text><text x="281.0" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">validate_conversations.py</text><text x="281.0" y="324.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">traces facts to the basis</text><path d="M281 268V234" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M174 170H192" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="388" y="110" width="170" height="120" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="473.0" y="134.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Test execution</text><text x="473.0" y="152.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">chatbot.run</text><text x="473.0" y="170.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">scripted member turns</text><text x="473.0" y="188.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">one trace record per</text><text x="473.0" y="206.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">conversation</text><rect x="388" y="268" width="170" height="76" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="473.0" y="288.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">System under test</text><text x="473.0" y="306.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">LangGraph bot, gpt-6-luna</text><text x="473.0" y="324.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">3 read-only tools, memory</text><path d="M473 230V264" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M366 170H384" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="580" y="110" width="190" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="675.0" y="130.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Layer 1: exact checks</text><text x="675.0" y="148.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">chatbot.checks (plain Python)</text><text x="675.0" y="166.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">tools, arguments, facts</text><rect x="580" y="200" width="190" height="76" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="675.0" y="220.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Layer 2: LLM judge</text><text x="675.0" y="238.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">chatbot.judge, gpt-6-sol</text><text x="675.0" y="256.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">12 behaviour checks</text><rect x="580" y="300" width="190" height="94" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/><text x="675.0" y="320.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#712B13" text-anchor="middle" dominant-baseline="central">Testing the judge</text><text x="675.0" y="338.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">40 seeded replies, all right</text><text x="675.0" y="356.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">blind labels: held-out</text><text x="675.0" y="374.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">22 of 23 agree; frozen</text><path d="M675 296V280" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M558 160H576" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M558 200H566V238H576" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="792" y="110" width="124" height="166" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="854.0" y="139.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Verdict</text><text x="854.0" y="157.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">a turn passes</text><text x="854.0" y="175.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">only if both</text><text x="854.0" y="193.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">layers pass;</text><text x="854.0" y="211.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">chatbot.compare:</text><text x="854.0" y="229.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">mean [min-max]</text><text x="854.0" y="247.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">over runs</text><path d="M770 148H788" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M770 238H788" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><text x="24" y="428" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Comparison on the same 28 conversations: our two layers against four general DeepEval metrics (same judge model)</text><rect x="24" y="446" width="892" height="144" rx="6" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><rect x="24" y="446" width="892" height="24" rx="6" fill="#EEEDFE"/><text x="34" y="458.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central"></text><text x="296" y="458.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">Our checks and judge</text><text x="558" y="458.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#3C3489" text-anchor="start" dominant-baseline="central">DeepEval general metrics</text><path d="M24 470H916" stroke="#E5E3DC" stroke-width="0.8"/><text x="34" y="482.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Judged against</text><text x="296" y="482.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">our 12 rules from the spec, turn by turn</text><text x="558" y="482.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">not our rules: helpfulness, completeness, memory</text><path d="M24 494H916" stroke="#E5E3DC" stroke-width="0.8"/><text x="34" y="506.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">14 conversations breaking a spec rule*</text><text x="296" y="506.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">flagged 14 of 14</text><text x="558" y="506.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">flagged 0 of 14 (expected: not told the rules)</text><path d="M24 518H916" stroke="#E5E3DC" stroke-width="0.8"/><text x="34" y="530.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Correct refusals marked as failures</text><text x="296" y="530.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">none seen</text><text x="558" y="530.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">4 (medical advice, privacy, actions, outage)</text><path d="M24 542H916" stroke="#E5E3DC" stroke-width="0.8"/><text x="34" y="554.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Checked against human labels</text><text x="296" y="554.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">yes: held-out 22 of 23 agree</text><text x="558" y="554.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">no</text><path d="M24 566H916" stroke="#E5E3DC" stroke-width="0.8"/><text x="34" y="578.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Cost per run</text><text x="296" y="578.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">about $0.49 (text checks are free)</text><text x="558" y="578.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">$2.21</text><text x="24" y="616" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">* e.g. internal codes shown to the member, the member&#x27;s own dates stated as fact, a mistyped ID looked up before confirming. The point: general</text><text x="24" y="632" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">metrics alone would have passed this bot, and the 4 conversations they did fail were the bot doing the right thing (required refusals).</text><rect x="24" y="652" width="892" height="84" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/><text x="470.0" y="676.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#444441" text-anchor="middle" dominant-baseline="central">Unit tests of the code and tooling: pytest, 113 tests, free</text><text x="470.0" y="694.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">access check, chunking, prompt experiments, checks, judge plumbing, labels, compare, diagrams, CI gate.</text><text x="470.0" y="712.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">They test our code, not the bot&#x27;s replies; the replies are tested by the two layers above.</text></svg>