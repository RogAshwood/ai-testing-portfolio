<svg xmlns="http://www.w3.org/2000/svg" width="760" height="526" viewBox="0 0 760 526" role="img"><title>How AI test generation was benchmarked</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="760" height="526" rx="12" fill="#FCFCFB"/><text x="20" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">How AI test generation was benchmarked</text><text x="130.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">INPUTS</text><text x="380.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">SYSTEM UNDER TEST</text><text x="630.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">CHECKS</text><rect x="530" y="78" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="630.0" y="89.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Golden set</text><text x="630.0" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">78 expected test ideas,</text><text x="630.0" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">hidden from the generator</text><rect x="30" y="160" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="130.0" y="171.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">User stories</text><text x="130.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">10 stories, 39 acceptance</text><text x="130.0" y="207.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">criteria</text><rect x="280" y="160" width="200" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" /><text x="380.0" y="171.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Test generator</text><text x="380.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Prompt v1 or v2,</text><text x="380.0" y="207.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">cheaper LLM</text><rect x="280" y="242" width="200" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" /><text x="380.0" y="262.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Test cases</text><text x="380.0" y="280.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">JSON, one set per story</text><rect x="530" y="160" width="200" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="630.0" y="171.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Schema check (code)</text><text x="630.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Valid JSON with the</text><text x="630.0" y="207.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">required fields</text><rect x="530" y="242" width="200" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="630.0" y="253.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">LLM judge: each case</text><text x="630.0" y="271.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Correct? Technique?</text><text x="630.0" y="289.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Duplicate?</text><rect x="530" y="324" width="200" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="630.0" y="335.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">LLM judge: coverage</text><text x="630.0" y="353.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Which expected ideas</text><text x="630.0" y="371.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">were found (recall)</text><path d="M231 189.0H278" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M380.0 219V240" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M481 271.0H505.0" fill="none" stroke="#5F5E5A" stroke-width="1.2"/><path d="M505.0 189.0V353.0" fill="none" stroke="#5F5E5A" stroke-width="1.2"/><path d="M505.0 189.0H528" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M505.0 271.0H528" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M505.0 353.0H528" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M731 107.0H746V353.0H732" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="280" y="412" width="450" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="505.0" y="428.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Scores per story, added to the history file</text><text x="505.0" y="446.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">The judge was itself checked against my labels and seeded defects</text><rect x="180.3" y="496" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="200.3" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Inputs and oracle</text><rect x="346.5" y="496" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8" /><text x="366.5" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">System under test</text><rect x="512.7" y="496" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="532.7" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Check</text><path d="M630.0 383V410" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/></svg>