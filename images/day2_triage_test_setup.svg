xt x="380.0" y="271.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Category, routing,</text><text x="380.0" y="289.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">reason code, summary</text><rect x="530" y="160" width="200" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="630.0" y="171.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Rule checks (code)</text><text x="630.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Exact match, safety rule,</text><text x="630.0" y="207.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">schema, fairness pairs</text><rect x="530" y="242" width="200" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="630.0" y="253.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">LLM judge</text><text x="630.0" y="271.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Summary quality, itself</text><text x="630.0" y="289.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">checked against my labels</text><rect x="530" y="324" width="200" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="630.0" y="335.0" font-family="Segoe UI, 