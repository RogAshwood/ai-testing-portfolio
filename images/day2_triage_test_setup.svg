<svg xmlns="http://www.w3.org/2000/svg" width="760" height="526" viewBox="0 0 760 526" role="img"><title>How the claim-triage step was tested</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="760" height="526" rx="12" fill="#FCFCFB"/><text x="20" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">How the claim-triage step was tested</text><text x="130.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">INPUTS</text><text x="380.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">SYSTEM UNDER TEST</text><text x="630.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">CHECKS</text><rect x="530" y="78" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="630.0" y="89.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Expected results</text><text x="630.0" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">From the plan rules,</text><text x="630.0" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">checked by reference code</text><rect x="30" y="160" width="200" height="5