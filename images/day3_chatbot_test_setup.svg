<svg xmlns="http://www.w3.org/2000/svg" width="760" height="526" viewBox="0 0 760 526" role="img"><title>How the member-help chatbot was tested</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="760" height="526" rx="12" fill="#FCFCFB"/><text x="20" y="26" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">How the member-help chatbot was tested</text><text x="130.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">INPUTS</text><text x="380.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">SYSTEM UNDER TEST</text><text x="630.0" y="58" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#888780" text-anchor="middle" dominant-baseline="central">CHECKS</text><rect x="280" y="78" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="380.0" y="98.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Policy documents</text><text x="380.0" y="116.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">10 member documents</text><rect x="530" y="78" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="630.0" y="89.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Golden set</text><text x="630.0" y="107.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">15 questions: answer,</text><text x="630.0" y="125.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">key facts, behaviour</text><rect x="30" y="160" width="200" height="58" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="130.0" y="171.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Member questions</text><text x="130.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Incl. unanswerable,</text><text x="130.0" y="207.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">adversarial, unsafe asks</text><rect x="30" y="242" width="200" height="58" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" /><text x="130.0" y="253.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#633806" text-anchor="middle" dominant-baseline="central">Fault injection</text><text x="130.0" y="271.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">Retriever broken</text><text x="130.0" y="289.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#854F0B" text-anchor="middle" dominant-baseline="central">on purpose</text><rect x="280" y="160" width="200" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" /><text x="380.0" y="180.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Retriever</text><text x="380.0" y="198.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">TF-IDF, top 3 chunks</text><rect x="280" y="242" width="200" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" /><text x="380.0" y="253.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Generator</text><text x="380.0" y="271.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Cheaper LLM writes</text><text x="380.0" y="289.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">the answer</text><rect x="280" y="324" width="200" height="58" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1.4" /><text x="380.0" y="344.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Answer</text><text x="380.0" y="362.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">Reply to the member</text><rect x="530" y="160" width="200" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="630.0" y="171.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Retriever checks</text><text x="630.0" y="189.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Did the key facts</text><text x="630.0" y="207.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">arrive?</text><rect x="530" y="242" width="200" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="630.0" y="253.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Generator checks</text><text x="630.0" y="271.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Given the right text: faithful,</text><text x="630.0" y="289.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">correct, safe?</text><rect x="530" y="324" width="200" height="58" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="630.0" y="335.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">End-to-end checks</text><text x="630.0" y="353.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">Same checks on the whole</text><text x="630.0" y="371.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">chatbot, 3 repeats</text><path d="M231 189.0H278" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M231 271.0H255.0V189.0H278" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M380.0 137V158" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M380.0 219V240" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M380.0 301V322" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M630.0 137V158" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M481 189.0H528" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M481 271.0H528" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><path d="M481 353.0H528" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/><rect x="280" y="412" width="450" height="50" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="505.0" y="428.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">The LLM judge behind the judged checks</text><text x="505.0" y="446.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">was itself checked against my labels and 8 deliberately bad answers</text><rect x="67.5" y="496" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" /><text x="87.5" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Inputs and oracle</text><rect x="233.7" y="496" width="14" height="14" rx="3" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8" /><text x="253.7" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">System under test</text><rect x="399.9" y="496" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8" /><text x="419.9" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Check</text><rect x="486.9" y="496" width="14" height="14" rx="3" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" /><text x="506.9" y="503" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Deliberate attack or fault</text><path d="M630.0 383V410" fill="none" stroke="#5F5E5A" stroke-width="1.2"  marker-end="url(#a)"/></svg>