<svg xmlns="http://www.w3.org/2000/svg" width="680" height="734" viewBox="0 0 680 734" role="img"><title>How DeepEval scores a generated answer</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="734" rx="12" fill="#FCFCFB"/><rect x="40" y="30" width="140" height="76" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="54" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Question</text><text x="54" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">the member's</text><text x="54" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">question</text><path d="M110 106V128" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="193" y="30" width="140" height="76" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="207" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Answer</text><text x="207" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">from the generator</text><text x="207" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">(gpt-6-luna)</text><path d="M263 106V128" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="347" y="30" width="140" height="76" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="361" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Chunks</text><text x="361" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">given to the</text><text x="361" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">generator</text><path d="M417 106V128" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="500" y="30" width="140" height="76" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="514" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Golden set row</text><text x="514" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">expected_answer,</text><text x="514" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">expected_behaviour</text><path d="M570 106V128" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="130" width="600" height="140" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="54" y="150" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">DeepEval test case (LLMTestCase): one per question, with these fields</text><text x="54" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">input = the question</text><text x="54" y="190" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">actual_output = the answer</text><text x="54" y="208" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">retrieval_context = chunks given to the generator</text><text x="54" y="226" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">context = correct chunks (used by hallucination)</text><text x="54" y="244" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">expected_output = expected_answer, or expected_behaviour for behaviour tests</text><path d="M340 270V292" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="170" y="294" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="312.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#085041" text-anchor="middle" dominant-baseline="central">Judge: gpt-6-sol</text><text x="340.0" y="332.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">DeepEval sends it one prompt per metric</text><path d="M340 350V372" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="30" y="374" width="620" height="208" rx="16" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8" stroke-dasharray="5 4"/><text x="340" y="396" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Metrics: each compares the answer with one reference</text><rect x="40" y="412" width="190" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="54" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Faithfulness</text><text x="54" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">vs chunks given</text><text x="54" y="472" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">all 15 questions</text><rect x="245" y="412" width="190" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="259" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Answer relevancy</text><text x="259" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">vs the question</text><text x="259" y="472" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">all 15 questions</text><rect x="450" y="412" width="190" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="464" y="432" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Hallucination</text><text x="464" y="454" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">vs correct chunks</text><text x="464" y="472" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">12 answerable</text><rect x="40" y="496" width="190" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="54" y="516" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Correctness (G-Eval)</text><text x="54" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">vs expected_answer</text><text x="54" y="556" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">12 answerable</text><rect x="245" y="496" width="190" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="259" y="516" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Declines (G-Eval)</text><text x="259" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">vs expected_behaviour</text><text x="259" y="556" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">3 unanswerable</text><rect x="450" y="496" width="190" height="76" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="464" y="516" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Safe conduct (G-Eval)</text><text x="464" y="538" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">vs expected_behaviour</text><text x="464" y="556" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">4 adversarial/refusal</text><path d="M340 582V604" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="170" y="606" width="340" height="56" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="340.0" y="624.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Score 0 to 1 and the judge's reason</text><text x="340.0" y="644.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">saved to results/deepeval_generator_*.csv</text><text x="340" y="690" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">G-Eval: a custom test written as plain-language steps for the judge to follow.</text><text x="340" y="710" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Higher is better for every metric, including hallucination in DeepEval 4.2.8.</text></svg>