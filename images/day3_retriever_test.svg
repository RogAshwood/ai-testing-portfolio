<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" role="img"><title>What the retriever test compares</title><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="680" height="520" rx="12" fill="#FCFCFB"/><rect x="60" y="30" width="300" height="44" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="210.0" y="52.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Q02: "Is acupuncture covered?"</text><path d="M210 74V98" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="60" y="100" width="300" height="50" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="210.0" y="115.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#3C3489" text-anchor="middle" dominant-baseline="central">Retriever</text><text x="210.0" y="135.0" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#534AB7" text-anchor="middle" dominant-baseline="central">TF-IDF, top k=3 chunks</text><path d="M210 150V174" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="60" y="176" width="300" height="96" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="74" y="196" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Top 3 chunks passed on</text><text x="74" y="218" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">1) 01_plan_overview#5</text><text x="74" y="236" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">2) 03_exclusions#3</text><text x="74" y="254" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">3) 01_plan_overview#2</text><rect x="390" y="30" width="250" height="242" rx="8" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="404" y="50" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Golden set row for Q02</text><text x="404" y="72" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Expected source</text><text x="404" y="90" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">03_exclusions</text><text x="404" y="108" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Key facts</text><text x="404" y="126" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">acupuncture</text><text x="404" y="144" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">alternative therapies</text><text x="404" y="162" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#2C2C2A" text-anchor="start" dominant-baseline="central">Expected answer</text><text x="404" y="180" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Acupuncture is not covered:</text><text x="404" y="198" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">it is an alternative therapy</text><path d="M210 272V296" fill="none" stroke="#888780" stroke-width="1"/><path d="M515 272V296" fill="none" stroke="#888780" stroke-width="1"/><path d="M185 296H515" fill="none" stroke="#888780" stroke-width="1"/><path d="M185 296V318" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><path d="M495 296V318" fill="none" stroke="#5F5E5A" stroke-width="1.2" marker-end="url(#a)"/><rect x="40" y="320" width="290" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="54" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Deterministic checks (free)</text><text x="54" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Doc hit@3: yes</text><text x="54" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">a 03_exclusions chunk arrived</text><text x="54" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Key-fact recall: 0 of 2</text><text x="54" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">neither fact is in the 3 chunks</text><text x="54" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Verdict: wrong chunk, answer lost</text><rect x="350" y="320" width="290" height="150" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="364" y="340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">LLM judge checks (gpt-6-sol)</text><text x="364" y="362" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Precision</text><text x="364" y="380" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">are useful chunks ranked first?</text><text x="364" y="398" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Recall</text><text x="364" y="416" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">can each expected sentence be found?</text><text x="364" y="434" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#085041" text-anchor="start" dominant-baseline="central">Relevancy</text><text x="364" y="452" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#0F6E56" text-anchor="start" dominant-baseline="central">how much of the text is on topic?</text><text x="340" y="496" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Both checks compare what the retriever returned with the golden set. Nothing is generated.</text></svg>