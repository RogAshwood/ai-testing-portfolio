ly="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Free checks</text><rect x="296" y="515" width="14" height="14" rx="3" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="316" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">LLM judge</text><rect x="389" y="515" width="14" height="14" rx="3" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.8"/><text x="409" y="522" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="start" dominant-baseline="central">Data, files, runners</text><text x="340" y="556" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Only rag_pipeline.py and rag_judges.py call the OpenAI API (key in .env).</text><text x="340" y="576" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Everything else, including the first CI test, runs free.</text></svg>