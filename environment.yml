name: ai-testing
channels:
  - conda-forge
dependencies:
  - pandas
  - matplotlib
  - jupyterlab
  - python-dotenv
  - python=3.11
  - nodejs>=22.22,<23
  - scikit-learn      # Day 3: TF-IDF retriever
  - ipywidgets        # Day 3: DeepEval progress display in Jupyter
  - ipykernel
  - pip
  - pip:
      - deepeval==4.2.8
      - langgraph==1.2.20        # M5: agent graph and memory
      - langchain-openai==1.7.3  # M5: OpenAI model for the agent
      - langchain-core==1.7.2    # M5: pinned with langchain-openai
      - langfuse==5.2.0          # M5: trace viewing (optional at run time)
