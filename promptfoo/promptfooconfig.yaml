# Harbourlight Health claim triage: prompt regression suite
# Run from the repo root:
#   npx promptfoo@latest eval -c promptfoo/promptfooconfig.yaml
# File paths below are relative to this config file.
#
# Change history
#   2026-10-08  Initial version.
#   2026-10-08  Smoke test fix: JavaScript checks rewritten as two-line scripts (they errored as one-liners).
#   2026-10-08  Smoke test fix: judge (summary_quality) now sees the full claim record; it was
#               failing correct summaries because it could not see the receipt, referral or plan rules.

description: Harbourlight Health claim triage - prompt v1 vs v2 across two models

# What is under test: two prompt versions
prompts:
  - id: file://prompts/triage_v1.txt
    label: v1-baseline
  - id: file://prompts/triage_v2.txt
    label: v2-rules

# Where it runs: a cheaper and a stronger model.
# JSON mode makes the model return a JSON object (both prompts ask for JSON).
providers:
  - id: openai:chat:gpt-6-luna
    label: luna-cheap
    config:
      response_format:
        type: json_object
  - id: openai:chat:gpt-6-sol
    label: sol-strong
    config:
      response_format:
        type: json_object

# Test data: one test per CSV row; each column becomes a variable
tests: file://../datasets/claim_triage.csv

# Applied to every test
defaultTest:
  vars:
    # Single source of truth: the rules file is inserted into prompt v2
    plan_rules: file://../datasets/plan_rules.md

  options:
    # The judge model for llm-rubric
    provider: openai:chat:gpt-6-sol

  assert:
    # 1. Format: valid JSON with the agreed fields and allowed values
    - type: is-json
      metric: format
      value:
        type: object
        required: [claim_id, category, routing, reason_code, summary]
        additionalProperties: false
        properties:
          claim_id:
            type: string
          category:
            enum: [gp_visit, consultant_visit, physiotherapy, prescription, day_case, inpatient, excluded, unclear]
          routing:
            enum: [auto_approve, manual_review, decline_recommended]
          reason_code:
            enum: [UNCLEAR, EXCLUDED, WAITING_PERIOD, LATE_SUBMISSION, ANNUAL_LIMIT_REACHED, MISSING_RECEIPT, MISSING_REFERRAL, MISSING_PREAUTH, INPATIENT_REVIEW, OVER_LIMIT, HIGH_VALUE, WITHIN_RULES]
          summary:
            type: string

    # UPDATED 2026-10-08 after smoke testing: the checks were one-line try/catch
    # scripts, which Promptfoo cannot run (see note below), so they all errored.
    # Note: each JavaScript check below is written over two lines on purpose.
    # Promptfoo treats a one-line script as an expression; two or more lines as a function body.
    # If the output is not valid JSON, JSON.parse throws and the check fails.

    # 2. Traceability: claim_id returned exactly as received
    - type: javascript
      metric: claim_id
      value: |
        const out = typeof output === 'string' ? JSON.parse(output) : output;
        return out.claim_id === context.vars.claim_id;

    # 3-5. Correctness against the oracle (exact match)
    - type: javascript
      metric: category
      value: |
        const out = typeof output === 'string' ? JSON.parse(output) : output;
        return out.category === context.vars.expected_category;

    - type: javascript
      metric: routing
      value: |
        const out = typeof output === 'string' ? JSON.parse(output) : output;
        return out.routing === context.vars.expected_routing;

    - type: javascript
      metric: reason_code
      value: |
        const out = typeof output === 'string' ? JSON.parse(output) : output;
        return out.reason_code === context.vars.expected_reason_code;

    # 6. Hard safety rule (must be 100%): never auto-approve a claim the
    #    rules do not auto-approve. This covers the conduct rule in section 8
    #    (missing receipt, referral or pre-authorisation, or over the limit)
    #    and every other false auto-approval.
    - type: javascript
      metric: safety_no_false_auto_approve
      value: |
        const out = typeof output === 'string' ? JSON.parse(output) : output;
        return !(out.routing === 'auto_approve' && context.vars.expected_routing !== 'auto_approve');

    # 7. Summary quality, judged by an LLM (binary pass/fail)
    #    UPDATED 2026-10-08 after smoke testing: the judge originally saw only the
    #    treatment description, amount and claimant note. It then failed correct
    #    summaries for "inventing" a receipt, referral and limits that were in the
    #    record or the plan rules (false failures). The judge now sees the full claim
    #    record and is told that statements about plan rules are allowed.
    - type: llm-rubric
      metric: summary_quality
      value: |
        The output is a JSON object from a health insurance claim triage step. Judge only its "summary" field.

        This is the full claim record the triage step received:
        claim_id: {{claim_id}}
        policy_start_date: {{policy_start_date}}
        treatment_date: {{treatment_date}}
        submission_date: {{submission_date}}
        treatment_description: {{treatment_description}}
        amount_claimed: {{amount_claimed}}
        receipt_attached: {{receipt_attached}}
        referral_attached: {{referral_attached}}
        preauth_number: {{preauth_number}}
        used_this_year: {{used_this_year}}
        claimant_note: {{claimant_note}}

        Facts about the claim must match this record. The summary may also refer to plan rules you have
        not been shown, such as per-visit limits, annual limits, the waiting period or deadlines.
        Do not fail the summary for mentioning those rules.

        Pass only if ALL of these are true:
        1. The summary describes this claim accurately and states no claim facts that contradict or are missing from the record.
        2. The summary states a reason that is consistent with the "routing" and "reason_code" in the same JSON.
        3. The summary gives no diagnosis, no medical advice and no promise that the claim will be paid.
        4. The summary is one or two sentences.
        Otherwise fail.

    # 8. Non-functional: response time and cost per call (calibrate after the first run)
    - type: latency
      metric: nft
      threshold: 20000
    - type: cost
      metric: nft
      threshold: 0.01
