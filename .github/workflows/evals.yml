# Weekly AI evals: Promptfoo claim triage and DeepEval RAG tests.
# (The test-generation benchmark has its own workflow, benchmark.yml: monthly and on change.)
#
# Scope and gates agreed 2026-10-29 (see bench/ci_thresholds.py for every threshold and its baseline):
#   Promptfoo   prompt v3, both models, 35 claims    HARD on sol-strong, luna-cheap reported only
#   DeepEval    tests/test_rag.py, 5 tests           HARD: 5/5 pass
# Estimated cost per run: about $0.21 (OpenAI). The red team is not run here (manual, see README).
#
# Both suites run even if the first fails (if: always()), so one red suite does not hide the other.
# The job fails if any HARD gate fails; warnings appear in the run summary only.
#
# What is kept where:
#   committed to the repo (permanent)  the gate tables (results/ci_gates/*evals-N_*)
#   run artifact only (90 days)        the gate tables and results/ci/promptfoo_ci.json (about 3 MB a run,
#                                      too large to commit weekly; its headline numbers are in the gate table)
#
# Needs one repository secret: OPENAI_API_KEY (Settings > Secrets and variables > Actions).
#
# Change history
#   2026-10-29  v1  first version (Day 5).
#   2026-10-29  v2  benchmark run files and gate tables committed as well as the history file.
#   2026-10-29  v3  benchmark moved to benchmark.yml (monthly and on change); run label evals-N.

name: AI evals

on:
  schedule:
    - cron: "23 5 * * 1"        # Mondays 05:23 UTC
  workflow_dispatch: {}          # "Run workflow" button in the Actions tab

permissions:
  contents: write                # to commit the gate tables

concurrency:
  group: ai-evals-commit         # shared with benchmark.yml, so the two never push at the same time
  cancel-in-progress: false

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: bash -el {0}      # login shell, so the conda env is active in every step
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      DEEPEVAL_TELEMETRY_OPT_OUT: "YES"
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PYTHONUTF8: "1"
      CI_RUN_LABEL: evals-${{ github.run_number }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Stop if the API key secret is missing
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Repository secret OPENAI_API_KEY is not set"; exit 1
          fi

      - name: Set up the conda env from environment.yml
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: ai-testing
          conda-remove-defaults: true

      - name: Show tool versions
        run: |
          python --version; node --version
          python -c "import deepeval; print('deepeval', deepeval.__version__)"
          npx -y promptfoo@0.124.1 --version

      # 1. Promptfoo. Promptfoo's own exit code would fail on any failed assertion (including the
      #    known luna-cheap defect), so it is set to 0 and bench.promptfoo_gate applies the agreed gates.
      - name: "Promptfoo: run claim triage (prompt v3, both models)"
        id: promptfoo
        env:
          PROMPTFOO_FAILED_TEST_EXIT_CODE: "0"
        run: |
          mkdir -p results/ci
          npx -y promptfoo@0.124.1 eval -c promptfoo/promptfooconfig.yaml \
            --filter-prompts v3-rules-dates --no-cache --no-share --no-table \
            -o results/ci/promptfoo_ci.json

      - name: "Promptfoo: quality gates"
        if: always() && steps.promptfoo.outcome == 'success'
        run: python -m bench.promptfoo_gate results/ci/promptfoo_ci.json

      # 2. DeepEval: the test runner's exit code is the gate (5/5 must pass).
      - name: "DeepEval: RAG chatbot tests"
        if: always()
        run: deepeval test run tests/test_rag.py

      - name: Upload results as a run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-results-${{ github.run_number }}
          path: |
            results/ci/
            results/ci_gates/*evals-${{ github.run_number }}_*
          retention-days: 90
          if-no-files-found: warn

      - name: Commit the gate tables
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add results/ci_gates/*"${CI_RUN_LABEL}"_* || echo "No gate tables from this run."
          if git diff --cached --quiet; then
            echo "No new results; nothing to commit."
          else
            git commit -m "CI: results of ${CI_RUN_LABEL}"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
